[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optimeo"
version = "1.0"
description = "OPTIMEO: Bayesian Optimization Web App for Process Tuning, Modeling, and Orchestration"
readme = "README.md"
requires-python = ">=3.6"
license = {text = "MIT License"}
authors = [
    {name = "Colin Bousige", email = "colin.bousige@cnrs.fr"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "ax-platform==0.5.0",
    "definitive_screening_design==0.5.0",
    "dexpy==0.12",
    "doepy==0.0.1",
    "matplotlib==3.10.1",
    "numpy==2.2.0",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "plotly==5.24.0",
    "pyDOE3==1.0.4",
    "pyjanitor==0.31.0",
    "scikit_learn==1.6.1",
    "seaborn==0.13.2",
    "statsmodels==0.14.2",
    "streamlit==1.44.1",
    "xlrd==2.0.1",
]

[project.urls]
Homepage = "https://github.com/colinbousige/OPTIMEO"
Repository = "https://github.com/colinbousige/OPTIMEO"

[tool.setuptools.packages.find]
include = ["optimeo*"]


