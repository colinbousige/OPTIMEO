name: Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the project
        run: pip install .

      - name: Install documentation dependencies
        run: pip install -r docs/requirements.txt

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Generate documentation
        run: |
          cp CHANGELOG.md docs/source/CHANGELOG.md
          cp LICENSE docs/source/LICENSE
          mkdir -p docs/source/examples/notebooks
          cp notebooks/doe.ipynb docs/source/examples/notebooks/doe.ipynb
          cp notebooks/bo.ipynb docs/source/examples/notebooks/bo.ipynb
          cp notebooks/MLanalysis.ipynb docs/source/examples/notebooks/MLanalysis.ipynb
          cp notebooks/*.csv docs/source/examples/notebooks/
          cp optimeo/app/resources/logo.png docs/source/_static/logo.png
          python - << 'PY'
          import json
          from pathlib import Path

          marker = "# docs-warning-suppress"
          suppress_source = [
              marker + "\n",
              "import logging\n",
              "import warnings\n",
              "warnings.filterwarnings('ignore', category=DeprecationWarning, module=r'torch\\.jit\\._script')\n",
              "warnings.filterwarnings('ignore', category=DeprecationWarning, module=r'matplotlib\\._fontconfig_pattern')\n",
              "warnings.filterwarnings('ignore', message=r\".*oneOf.*deprecated.*one_of.*\", module=r'matplotlib\\._fontconfig_pattern')\n",
              "warnings.filterwarnings('ignore', message=r\".*parseString.*deprecated.*parse_string.*\", module=r'matplotlib\\._fontconfig_pattern')\n",
              "warnings.filterwarnings('ignore', message=r\".*resetCache.*deprecated.*reset_cache.*\", module=r'matplotlib\\._fontconfig_pattern')\n",
              "try:\n",
              "    from ax.exceptions.core import AxParameterWarning\n",
              "    warnings.filterwarnings('ignore', category=AxParameterWarning)\n",
              "except Exception:\n",
              "    pass\n",
              "try:\n",
              "    from pyparsing import PyparsingDeprecationWarning\n",
              "    warnings.filterwarnings('ignore', category=PyparsingDeprecationWarning)\n",
              "except Exception:\n",
              "    pass\n",
              "logging.getLogger('ax').setLevel(logging.WARNING)\n",
              "logging.getLogger('ax.service.utils.instantiation').setLevel(logging.ERROR)\n",
              "logging.getLogger('ax.generation_strategy.dispatch_utils').setLevel(logging.WARNING)\n",
                "try:\n",
                "    import plotly.graph_objects as go\n",
                "    _orig_show = go.Figure.show\n",
                "    def _responsive_show(fig, *args, **kwargs):\n",
                "        fig.update_layout(autosize=True)\n",
                "        config = kwargs.get('config') or {}\n",
                "        config.setdefault('responsive', True)\n",
                "        kwargs['config'] = config\n",
                "        return _orig_show(fig, *args, **kwargs)\n",
                "    go.Figure.show = _responsive_show\n",
                "except Exception:\n",
                "    pass\n",
          ]

          nb_dir = Path("docs/source/examples/notebooks")
          for nb_path in nb_dir.glob("*.ipynb"):
              data = json.loads(nb_path.read_text(encoding="utf-8"))
              cells = data.get("cells", [])

              for cell in cells:
                if cell.get("cell_type") != "code":
                  continue
                source_lines = cell.get("source", [])
                normalized = []
                has_pio_import = False
                for line in source_lines:
                  line = line.replace('pio.renderers.default = "colab"', 'pio.renderers.default = "notebook_connected"')
                  line = line.replace("pio.renderers.default = 'colab'", "pio.renderers.default = 'notebook_connected'")
                  line = line.replace("fig.show()", "fig.show(config={'responsive': True})")
                  line = line.replace('fig.show(renderer="colab")', "fig.show(config={'responsive': True})")
                  line = line.replace("fig.show(renderer='colab')", "fig.show(config={'responsive': True})")
                  if "import plotly.io as pio" in line:
                    has_pio_import = True
                  normalized.append(line)
                if has_pio_import and not any("pio.renderers['notebook_connected'].config" in ln or 'pio.renderers["notebook_connected"].config' in ln for ln in normalized):
                  normalized.append("\npio.renderers['notebook_connected'].config = {'responsive': True}\n")
                cell["source"] = normalized

              if cells and cells[0].get("cell_type") == "code":
                  first_source = "".join(cells[0].get("source", []))
                  if marker in first_source:
                      continue
              cells.insert(
                  0,
                  {
                      "cell_type": "code",
                      "execution_count": None,
                      "metadata": {},
                      "outputs": [],
                      "source": suppress_source,
                  },
              )
              data["cells"] = cells
              nb_path.write_text(json.dumps(data, ensure_ascii=False), encoding="utf-8")
          PY
          PYTHONWARNINGS="ignore::DeprecationWarning" sphinx-build -b html docs/source docs/_build/html
          cp docs/_build/html/index.html docs/_build/html/optimeo.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
