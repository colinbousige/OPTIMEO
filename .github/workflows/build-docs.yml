name: Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git history access

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Use your preferred Python version

      - name: Install the project
        run: pip install .

      - name: Install pdoc
        run: pip install pdoc

      - name: Generate documentation
        run: |
          pdoc optimeo optimeo.analysis optimeo.bo optimeo.doe --logo logo.png --docformat numpy -o ./docs
          cp optimeo/app/resources/logo.png ./docs/
          cp optimeo/app/resources/logo.png ./docs/optimeo/
          cat > ./docs/index.html << 'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>OPTIMEO Documentation</title>
          </head>
          <body>
            <h1>OPTIMEO Documentation</h1>
            <p>
              OPTIMEO is a toolkit for process tuning with Design of Experiments,
              Bayesian Optimization, and data analysis/modeling.
            </p>

            <h2>Installation</h2>
            <pre><code>uv venv .venv --python 3.10
            source .venv/bin/activate
            uv pip install optimeo
            optimeo</code></pre>

            <h2>Usage</h2>
            <p>
              Start the local app with <code>optimeo</code>, or open
              <a href="https://optimeo.streamlit.app/">optimeo.streamlit.app</a>.
            </p>

            <h2>API Documentation</h2>
            <ul>
              <li><a href="optimeo.html">Package Overview</a></li>
              <li><a href="optimeo/analysis.html">Analysis API</a></li>
              <li><a href="optimeo/bo.html">Bayesian Optimization API</a></li>
              <li><a href="optimeo/doe.html">Design of Experiments API</a></li>
              <li><a href="examples/MLanalysis.html">Examples: ML Analysis</a></li>
              <li><a href="examples/bo.html">Examples: Bayesian Optimization</a></li>
              <li><a href="examples/doe.html">Examples: Design of Experiments</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs  # Use the correct path where your docs are generated

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
